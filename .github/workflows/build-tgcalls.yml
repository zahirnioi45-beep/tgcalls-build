name: Build tgcalls (Android arm64)

# Tahap 1: build library native Telegram (tgcalls + WebRTC) dari kode sumber publik
# Telegram Android, lalu simpan hasilnya sebagai artifact. Belum ada yang ditempel ke APK.
on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Versi NDK (coba r21e, r23c, r25b kalau gagal)"
        default: "r23c"
      ref:
        description: "Branch/tag Telegram Android"
        default: "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Ambil kode sumber Telegram Android
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/DrKLO/Telegram.git src
          ls src/TMessagesProj/jni | head -50

      - name: Pasang NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk_version }}

      - name: Pasang tool build
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm yasm

      - name: Konfigurasi CMake (arm64-v8a)
        working-directory: src/TMessagesProj/jni
        run: |
          set -o pipefail
          cmake -S . -B ../../../out -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../../../cmake-configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build out -j"$(nproc)" 2>&1 | tee build.log | tail -n 200

      - name: Kumpulkan hasil dan daftar simbol JNI
        if: always()
        run: |
          mkdir -p result
          find out -name "*.so" -exec cp {} result/ \; || true
          for f in result/*.so; do
            [ -f "$f" ] || continue
            ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only "$f" \
              | grep -E "Java_org_telegram_messenger_voip|Java_org_telegram_messenger_" > "result/$(basename "$f").jni-symbols.txt" || true
          done
          cp cmake-configure.log build.log result/ 2>/dev/null || true
          ls -la result

      - name: Unggah hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgcalls-arm64
          path: result/
